name: Tests

on:
  # Existing account-billing pause: automatic triggers remain disabled.
  # Restoring hosted CI is a separate authorized task.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run detect-secrets
        run: python -m pre_commit run detect-secrets --all-files --show-diff-on-failure

  unit:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ --tb=short

  release_artifact:
    name: Release Artifact Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install -e ".[dev]"

      - name: Build wheel and sdist
        run: |
          python -m build --wheel --sdist

      - name: Check distribution artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile
          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, got {wheels} {sdists}")
          required = {
              path.as_posix()
              for path in Path("libreevolve").rglob("*")
              if path.is_file()
              and "__pycache__" not in path.parts
              and path.suffix not in {".pyc", ".pyo"}
          }
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing package files: {missing}")
          with tarfile.open(sdists[0], "r:gz") as sdist:
              names = {
                  member.name.split("/", 1)[1]
                  for member in sdist.getmembers()
                  if member.isfile() and "/" in member.name
              }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"sdist is missing package files: {missing}")
          print(wheels[0])
          print(sdists[0])
          PY

      - name: Write release artifact provenance
        run: python -m libreevolve.tools.release_artifact_provenance --root .

      - name: Upload release smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libreevolve-release-smoke-artifacts
          path: dist/*

      - name: Install wheel and smoke CLI
        run: |
          python -m venv .venv-wheel-smoke
          . .venv-wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          libreevolve --help
          python -m libreevolve --help
