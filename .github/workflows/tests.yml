name: Tests

on:
  # Temporary pause while GitHub account billing is unresolved. Restore the
  # pull_request, push, and schedule triggers before treating CI as a release
  # gate again.
  # When those triggers are restored, retain the existing path scope:
  #   "docs/**", "papers/**", and "tests/**" (plus source/workflow changes).
  # The retained weekly source-refresh schedule is cron: "17 6 * * 1"; it is
  # intentionally disabled with the other automatic triggers until billing is
  # resolved.
  workflow_dispatch:
    inputs:
      run_live_integration:
        description: "Run paid provider tests after separate spending approval"
        type: boolean
        required: false
        default: false
      run_source_refresh_gate:
        description: "Run live AlphaEvolve source refresh drift check"
        required: false
        default: "false"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run detect-secrets
        run: python -m pre_commit run detect-secrets --all-files --show-diff-on-failure

  unit:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" --tb=short

  paper_docs:
    name: Paper and Docs Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate committed paper manifest
        run: python -m libreevolve.tools.paper_manifest --root .

      - name: Run docs, paper, and boundary verifier tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          test_paths = [Path("tests/test_agents_docs.py")]
          test_paths.extend(sorted(Path("tests").glob("test_paper_*.py")))
          test_paths.extend(sorted(Path("tests").glob("test_*boundary.py")))
          unique_paths = list(dict.fromkeys(test_paths))
          command = [sys.executable, "-m", "pytest", *(str(path) for path in unique_paths), "-q"]
          raise SystemExit(subprocess.call(command))
          PY

  source_refresh_gate:
    name: AlphaEvolve Source Refresh Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_source_refresh_gate == 'true')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compare live AlphaEvolve source responses to committed boundaries
        run: |
          set -o pipefail
          python -m libreevolve.tools.alphaevolve_source_refresh_gate --live --pretty | tee alphaevolve_source_refresh_report.json

      - name: Upload source refresh report
        uses: actions/upload-artifact@v4
        with:
          name: alphaevolve-source-refresh-report
          path: alphaevolve_source_refresh_report.json

  release_artifact:
    name: Release Artifact Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install -e ".[dev]"

      - name: Build wheel and sdist
        run: |
          rm -rf dist build *.egg-info
          python -m build --wheel --sdist

      - name: Check distribution artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile
          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, got {wheels} {sdists}")
          required = {
              path.as_posix()
              for path in Path("libreevolve").rglob("*")
              if path.is_file()
              and "__pycache__" not in path.parts
              and path.suffix not in {".pyc", ".pyo"}
          }
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing package files: {missing}")
          with tarfile.open(sdists[0], "r:gz") as sdist:
              names = {
                  member.name.split("/", 1)[1]
                  for member in sdist.getmembers()
                  if member.isfile() and "/" in member.name
              }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"sdist is missing package files: {missing}")
          print(wheels[0])
          print(sdists[0])
          PY

      - name: Write release artifact provenance
        run: python -m libreevolve.tools.release_artifact_provenance --root .

      - name: Upload release smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libreevolve-release-smoke-artifacts
          path: dist/*

      - name: Install wheel and smoke CLI
        run: |
          python -m venv .venv-wheel-smoke
          . .venv-wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          libreevolve --help
          python -m libreevolve --help

  integration:
    name: Integration Tests (Python 3.12)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_integration == true }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Skip integration tests when API key is unavailable
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "ANTHROPIC_API_KEY is not configured; skipping integration tests."

      - name: Run integration tests
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/integration/ -m integration --tb=short -rs
