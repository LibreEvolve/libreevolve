name: Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tests.yml"
      - ".pre-commit-config.yaml"
      - ".secrets.baseline"
      - "AGENTS.md"
      - "README.md"
      - "ROADMAP.md"
      - "docs/**"
      - "libreevolve/**"
      - "papers/**"
      - "pyproject.toml"
      - "tests/**"
  push:
    paths:
      - ".github/workflows/tests.yml"
      - ".pre-commit-config.yaml"
      - ".secrets.baseline"
      - "AGENTS.md"
      - "README.md"
      - "ROADMAP.md"
      - "docs/**"
      - "libreevolve/**"
      - "papers/**"
      - "pyproject.toml"
      - "tests/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run detect-secrets
        run: python -m pre_commit run detect-secrets --all-files --show-diff-on-failure

  unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" --tb=short

  integration:
    name: Integration Tests (Python 3.12)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Skip integration tests when API key is unavailable
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "ANTHROPIC_API_KEY is not configured; skipping integration tests."

      - name: Run integration tests
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/integration/ -m integration --tb=short -rs
