name: Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tests.yml"
      - ".pre-commit-config.yaml"
      - ".secrets.baseline"
      - "AGENTS.md"
      - "README.md"
      - "ROADMAP.md"
      - "docs/**"
      - "libreevolve/**"
      - "papers/**"
      - "pyproject.toml"
      - "tests/**"
  push:
    paths:
      - ".github/workflows/tests.yml"
      - ".pre-commit-config.yaml"
      - ".secrets.baseline"
      - "AGENTS.md"
      - "README.md"
      - "ROADMAP.md"
      - "docs/**"
      - "libreevolve/**"
      - "papers/**"
      - "pyproject.toml"
      - "tests/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run detect-secrets
        run: python -m pre_commit run detect-secrets --all-files --show-diff-on-failure

  unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" --tb=short

  paper_docs:
    name: Paper and Docs Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate committed paper manifest
        run: python -m libreevolve.tools.paper_manifest --root .

      - name: Run focused docs and paper tests
        run: python -m pytest tests/test_agents_docs.py tests/test_paper_manifest.py -q

  release_artifact:
    name: Release Artifact Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install -e ".[dev]"

      - name: Build wheel and sdist
        run: |
          rm -rf dist build *.egg-info
          python -m build --wheel --sdist

      - name: Check distribution artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile
          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, got {wheels} {sdists}")
          required = {
              path.as_posix()
              for path in Path("libreevolve/problems/examples").rglob("*")
              if path.is_file()
          }
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing bundled example files: {missing}")
          with tarfile.open(sdists[0], "r:gz") as sdist:
              names = {
                  member.name.split("/", 1)[1]
                  for member in sdist.getmembers()
                  if member.isfile() and "/" in member.name
              }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"sdist is missing bundled example files: {missing}")
          print(wheels[0])
          print(sdists[0])
          PY

      - name: Write release artifact provenance
        run: python -m libreevolve.tools.release_artifact_provenance --root .

      - name: Upload release smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libreevolve-release-smoke-artifacts
          path: dist/*

      - name: Install wheel and smoke CLI
        run: |
          python -m venv .venv-wheel-smoke
          . .venv-wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          libreevolve --help
          python -m libreevolve --help

  integration:
    name: Integration Tests (Python 3.12)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Skip integration tests when API key is unavailable
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "ANTHROPIC_API_KEY is not configured; skipping integration tests."

      - name: Run integration tests
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/integration/ -m integration --tb=short -rs
