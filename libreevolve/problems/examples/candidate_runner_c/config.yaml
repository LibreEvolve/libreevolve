max_generations: 20
initial_program_validity_policy: alphaevolve_strict
candidate_language_runners:
  - language: c
    candidate_role: task_primary_text
    file_patterns:
      - solution.c
    marker_grammar: whole_file_text_v1
    runner_command:
      - "{workspace}/program.exe"
    execution_status: executable_local_subprocess
    notes: Runs the locally compiled C executable; this is not a security sandbox.
candidate_build_systems:
  - name: c_compiler
    build_files:
      - solution.c
      - toolchain.lock
    build_command:
      - "{toolchain}"
      - -O2
      - -std=c11
      - -Wall
      - -Wextra
      - -Werror
      - solution.c
      - -o
      - program.exe
    artifact_patterns:
      - program.exe
    toolchain_candidates:
      - clang
      - gcc
      - cc
    toolchain_version_command:
      - "{toolchain}"
      - --version
    dependency_lock_sha256:
      toolchain.lock: a80258be5e144163c641ced9d4fa8838c23cbf94d3e6d7aaafbd31722991d54e
    execution_status: executable_local_subprocess
    notes: Resolves a host C compiler and records its identity; exact compiler pins are intentionally unset.
eval_stages:
  - name: run_c
    role: main_test
    mode: candidate_runner
    language_runner: c
    build_system: c_compiler
    timeout_sec: 20
