max_generations: 20
initial_program_validity_policy: alphaevolve_strict
candidate_language_runners:
  - language: expression
    candidate_role: task_primary_text
    file_patterns:
      - solution.expr
    marker_grammar: whole_file_text_v1
    runner_command:
      - "{python}"
      - -c
      - "from pathlib import Path; import sys; print(eval(Path(sys.argv[1]).read_text(encoding='utf-8'), {'__builtins__': {}}, {}))"
      - "{workspace}/build/program.expr"
    execution_status: executable_local_subprocess
    notes: Local expression-language smoke runner; not a security sandbox.
candidate_build_systems:
  - name: expression_copy
    build_files:
      - solution.expr
    build_command:
      - "{python}"
      - -c
      - "from pathlib import Path; Path('build').mkdir(exist_ok=True); Path('build/program.expr').write_text(Path('solution.expr').read_text(encoding='utf-8'), encoding='utf-8')"
    artifact_patterns:
      - build/**
    execution_status: executable_local_subprocess
    notes: Copies the task-primary expression into a generated build artifact.
eval_stages:
  - name: run_expression
    role: main_test
    mode: candidate_runner
    language_runner: expression
    build_system: expression_copy
    timeout_sec: 10
