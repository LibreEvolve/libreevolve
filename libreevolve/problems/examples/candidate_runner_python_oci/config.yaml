max_generations: 20
initial_program_validity_policy: alphaevolve_strict
candidate_language_runners:
  - language: python_oci
    candidate_role: task_primary_text
    file_patterns:
      - solution.py
    marker_grammar: whole_file_text_v1
    runner_command:
      - python
      - "{primary}"
    execution_status: executable_local_subprocess
    notes: Runs the candidate in the build system's digest-pinned OCI image.
candidate_build_systems:
  - name: python_bytecode_oci
    build_files:
      - solution.py
      - toolchain.lock
    build_command:
      - "{toolchain}"
      - -m
      - py_compile
      - solution.py
    artifact_patterns:
      - __pycache__/*.pyc
    toolchain_candidates:
      - python
    toolchain_version_command:
      - "{toolchain}"
      - --version
    dependency_lock_sha256:
      toolchain.lock: 38d324332075cdb6a07d8d9d39a93d4436aea0c6b0939e31730d8caf1b5b8f4c
    execution_environment:
      type: oci_container_v1
      runtime_candidates:
        - docker
        - podman
      image: docker.io/library/python@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
      pull_policy: if_missing
      network: none
      read_only_rootfs: true
      tmpfs_mb: 64
      memory_mb: 256
      cpus: 1
      pids_limit: 64
    execution_status: executable_local_subprocess
    notes: Pulls only the immutable image when absent; build and run networking stay disabled.
eval_stages:
  - name: run_python_oci
    role: main_test
    mode: candidate_runner
    language_runner: python_oci
    build_system: python_bytecode_oci
    timeout_sec: 60
