    direction: maximize
    primary: true
    bounds: [0.0, 1.0]
  - name: sorted_input_coverage
    direction: maximize
    primary: false
    bounds: [0.0, 1.0]
  - name: inverse_comparator_count
    direction: maximize
    primary: false
    bounds: [0.0, 1.0]
  - name: comparator_count
    direction: minimize
    primary: false
    bounds: [0.0, 81.0]
  - name: depth
    direction: minimize
    primary: false
    bounds: [0.0, 81.0]
  - name: target_achieved
    direction: maximize
    primary: false
    bounds: [0.0, 1.0]
