[build-system]
requires = ["setuptools>=68"]
# setuptools.backends.legacy:build unavailable in this env; .build_meta is the identical canonical alias
build-backend = "setuptools.build_meta"

[project]
name = "libreevolve"
version = "0.1.0"
description = "LibreEvolve engineering preview: bounded local bin-packing optimization with Codex OAuth"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Timothy Gregg", email = "timothy.gregg@complete.tech"},
]
keywords = ["evolutionary-computation", "llm", "program-synthesis", "map-elites", "quality-diversity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "click>=8.1",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pre-commit>=4.5",
    "detect-secrets>=1.5",
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
libreevolve = "libreevolve.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["libreevolve*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring API keys",
]
