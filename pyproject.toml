[build-system]
requires = ["setuptools>=68"]
# setuptools.backends.legacy:build unavailable in this env; .build_meta is the identical canonical alias
build-backend = "setuptools.build_meta"

[project]
name = "libreevolve"
version = "0.1.0"
description = "LLM-guided evolutionary program discovery, inspired by AlphaEvolve (Google DeepMind)"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Timothy Gregg", email = "Timothy.Gregg@complete.tech"},
]
keywords = ["alphaevolve", "evolutionary-computation", "llm", "program-synthesis", "map-elites"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "anthropic>=0.25",
    "openai>=1.23",
    "ollama>=0.1",
    "pyyaml>=6.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
libreevolve = "libreevolve.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["libreevolve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring API keys",
]
